<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DeployFlow architecture</text>

  <!-- Row 1: pipeline -->
  <rect x="30" y="60" width="180" height="72" rx="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Developer</text>
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="#334155">WSL2 · Git · Terraform</text>

  <rect x="260" y="60" width="170" height="72" rx="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
  <text x="345" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">GitHub</text>
  <text x="345" y="108" text-anchor="middle" font-size="11" fill="#334155">source code</text>

  <rect x="480" y="60" width="190" height="72" rx="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
  <text x="575" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">GitHub Actions</text>
  <text x="575" y="108" text-anchor="middle" font-size="11" fill="#334155">build · Trivy scan · push</text>

  <rect x="720" y="60" width="210" height="72" rx="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
  <text x="825" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Docker Hub</text>
  <text x="825" y="108" text-anchor="middle" font-size="11" fill="#334155">image registry</text>

  <path d="M210,96 H258" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="234" y="88" text-anchor="middle" font-size="10" fill="#334155">git push</text>
  <path d="M430,96 H478" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="454" y="88" text-anchor="middle" font-size="10" fill="#334155">triggers</text>
  <path d="M670,96 H718" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="694" y="88" text-anchor="middle" font-size="10" fill="#334155">push</text>

  <!-- AWS cloud -->
  <rect x="30" y="190" width="600" height="250" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="46" y="210" font-size="13" font-weight="bold" fill="#c2410c">AWS Cloud (ap-south-1)</text>

  <rect x="270" y="225" width="340" height="190" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="280" y="243" font-size="11" fill="#475569">VPC · public subnet · security group</text>

  <rect x="290" y="260" width="300" height="110" rx="8" fill="#fed7aa" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">EC2 server (deployflow-server)</text>
  <rect x="305" y="293" width="270" height="64" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="440" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Docker container: Flask app :5000</text>
  <text x="440" y="337" text-anchor="middle" font-size="11" fill="#334155">/  ·  /todos  ·  /health  ·  /metrics</text>

  <rect x="50" y="225" width="180" height="70" rx="8" fill="#fde68a" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">CloudWatch alarms</text>
  <text x="140" y="272" text-anchor="middle" font-size="10.5" fill="#334155">CPU &gt; 80% · server health</text>

  <rect x="50" y="320" width="180" height="56" rx="8" fill="#fde68a" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">SNS topic</text>
  <text x="140" y="362" text-anchor="middle" font-size="10.5" fill="#334155">deployflow-alerts</text>

  <rect x="50" y="470" width="180" height="44" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="489" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Email</text>
  <text x="140" y="505" text-anchor="middle" font-size="10.5" fill="#334155">alarm notifications</text>

  <path d="M290,300 L232,268" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="256" y="302" text-anchor="middle" font-size="10" fill="#334155">metrics</text>
  <path d="M140,295 V318" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="311" font-size="10" fill="#334155">alarm</text>
  <path d="M140,376 V468" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="458" font-size="10" fill="#334155">email alert</text>

  <!-- Laptop -->
  <rect x="700" y="190" width="230" height="300" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="715" y="210" font-size="13" font-weight="bold" fill="#6d28d9">Your laptop</text>

  <rect x="715" y="225" width="200" height="80" rx="8" fill="#ddd6fe" stroke="#334155" stroke-width="1.5"/>
  <text x="815" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">kind cluster</text>
  <text x="815" y="273" text-anchor="middle" font-size="11" fill="#334155">Deployment: 2 pods</text>
  <text x="815" y="289" text-anchor="middle" font-size="11" fill="#334155">+ Service</text>

  <rect x="715" y="335" width="200" height="56" rx="8" fill="#ddd6fe" stroke="#334155" stroke-width="1.5"/>
  <text x="815" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Prometheus :9090</text>
  <text x="815" y="378" text-anchor="middle" font-size="10.5" fill="#334155">reads metrics every 15 s</text>

  <rect x="715" y="420" width="200" height="56" rx="8" fill="#ddd6fe" stroke="#334155" stroke-width="1.5"/>
  <text x="815" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Grafana :3000</text>
  <text x="815" y="463" text-anchor="middle" font-size="10.5" fill="#334155">4-panel dashboard</text>

  <path d="M815,391 V418" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="823" y="410" font-size="9.5" fill="#334155">data source</text>

  <path d="M715,363 H592" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="658" y="340" text-anchor="middle" font-size="9.5" fill="#334155">scrape</text>
  <text x="658" y="352" text-anchor="middle" font-size="9.5" fill="#334155">every 15 s</text>

  <!-- Connections between rows -->
  <path d="M120,132 V188" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="128" y="166" font-size="10" fill="#334155">terraform apply</text>

  <path d="M575,132 V158 H380 V258" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="478" y="152" text-anchor="middle" font-size="10" fill="#334155">deploy</text>

  <path d="M880,132 V176 H500 V258" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M815,176 V223" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="815" cy="176" r="3" fill="#334155"/>
  <text x="690" y="170" text-anchor="middle" font-size="10" fill="#334155">pull image</text>

  <text x="480" y="545" text-anchor="middle" font-size="11" fill="#475569">Every push builds the image, scans it with Trivy (fails on fixable HIGH/CRITICAL problems), then deploys it to AWS.</text>
</svg>
